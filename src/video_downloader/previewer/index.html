<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Extractor — Stream Previewer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="noise"></div>

  <header class="header">
    <div class="logo">
      <span class="logo-icon">▶</span>
      <span class="logo-text">Video Extractor</span>
    </div>
    <p class="tagline">Stream & Media Previewer</p>
  </header>

  <main class="main">

    <section class="input-section">
      <div class="input-card">
        <label class="input-label" for="videoInput">Video / Media URL or Local Path</label>
        <div class="input-row">
          <input
            type="url"
            id="videoInput"
            class="url-input"
            placeholder="https://youtube.com/watch?v=...  or  direct stream / .mp4 link"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="play-btn" id="playBtn" onclick="loadVideo()">
            <span class="btn-icon">▶</span>
            <span class="btn-label">Play</span>
          </button>
        </div>
        <div class="input-hints">
          <span class="hint">YouTube</span>
          <span class="hint">Vimeo</span>
          <span class="hint">.mp4</span>
          <span class="hint">.webm</span>
          <span class="hint">.ogg</span>
          <span class="hint">.mov</span>
        </div>
      </div>
    </section>

    <section class="player-section" id="playerSection">

      <!-- Error state -->
      <div class="error-card" id="errorCard">
        <span class="error-icon">✕</span>
        <div>
          <p class="error-title">Couldn't load video</p>
          <p class="error-msg" id="errorMsg">Unknown error.</p>
        </div>
      </div>

      <!-- Loading state -->
      <div class="loader-card" id="loaderCard">
        <div class="spinner"></div>
        <span>Loading media stream…</span>
      </div>

      <!-- Direct video player -->
      <div class="video-wrap" id="directWrap">
        <video id="videoTag" controls playsinline>
          Your browser does not support HTML5 video.
        </video>
      </div>

      <!-- Embed iframe (YouTube / Vimeo) -->
      <div class="video-wrap" id="iframeWrap">
        <iframe
          id="embedFrame"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          title="Embedded video player"
        ></iframe>
      </div>

      <!-- Meta bar -->
      <div class="meta-bar" id="metaBar">
        <span class="meta-source" id="metaSource"></span>
        <a class="meta-link" id="metaLink" href="#" target="_blank" rel="noopener noreferrer">
          Open original ↗
        </a>
      </div>

    </section>

    <section class="history-section" id="historySection">
      <h2 class="history-title">Recent Previews</h2>
      <ul class="history-list" id="historyList"></ul>
      <button class="clear-btn" onclick="clearHistory()">Clear history</button>
    </section>

  </main>

  <footer class="footer">
    <p>Video Extractor CLI — High-Performance Multi-Agent Media Toolkit</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/history.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
