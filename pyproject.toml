[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-downloader"
version = "0.2.0"
description = "Resilient concurrent multi-agent command-line video and stream extractor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "ItzPnav" }
]
keywords = ["video", "downloader", "extractor", "stream", "cli", "m3u8", "scrapling", "yt-dlp", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "requests",
    "beautifulsoup4",
    "yt-dlp",
    "selenium",
    "scrapling[fetchers]",
    "markdownify",
    "langgraph",
    "psutil",
]

[project.scripts]
video = "video_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_downloader*"]

[tool.setuptools.package-data]
video_downloader = ["*.json", "routes/*.py", "extractors/*.py"]